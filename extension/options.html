<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 20px;
      min-width: 360px;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2 svg { color: #8264ff; }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #16162a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus {
      border-color: #8264ff;
    }
    input::placeholder {
      color: #555;
    }
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 3px;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-save {
      background: #8264ff;
      color: #fff;
    }
    .btn-save:hover { background: #6b4fdb; }
    .btn-test {
      background: #2a2a40;
      color: #ccc;
      border: 1px solid #444;
    }
    .btn-test:hover { background: #333350; }
    .status {
      margin-top: 12px;
      font-size: 12px;
      min-height: 18px;
      transition: opacity 0.3s;
    }
    .status.success { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.info { color: #8264ff; }
    .getting-started {
      background: rgba(130, 100, 255, 0.08);
      border: 1px solid rgba(130, 100, 255, 0.2);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }
    .getting-started-title {
      font-size: 13px;
      font-weight: 600;
      color: #c4b5fd;
      margin-bottom: 6px;
    }
    .getting-started-body {
      font-size: 12px;
      color: #aaa;
      line-height: 1.5;
    }
    .getting-started-body code {
      background: #16162a;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 12px;
      color: #c4b5fd;
    }
  </style>
</head>
<body>
  <h2>
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 1l-2 6-6 2 6 2 2 6 2-6 6-2-6-2-2-6z" fill="#8264ff"/></svg>
    Ticket Enhancer
  </h2>

  <div id="gettingStarted" class="getting-started" style="display:none;">
    <div class="getting-started-title">Getting Started</div>
    <div class="getting-started-body">
      Run <code>npx ticket-enhancer</code> in your terminal to start the server.
      You'll need Node.js 18+ and an Anthropic API key.
    </div>
  </div>

  <div class="field">
    <label for="serverUrl">Server URL</label>
    <input type="text" id="serverUrl" placeholder="http://localhost:7842" />
    <div class="hint">Leave blank for default (localhost:7842)</div>
  </div>

  <div class="field">
    <label for="authToken">Auth Token</label>
    <input type="password" id="authToken" placeholder="Optional — leave blank for local dev" />
    <div class="hint">Bearer token matching the server's AUTH_TOKEN</div>
  </div>

  <div class="field">
    <label for="extraInstructions">Tips for the AI (optional)</label>
    <textarea id="extraInstructions" rows="3" placeholder="e.g., Meeting notes are in Notion DB X, check #eng-backend on Slack, Sentry org is 'mycompany'" style="width:100%;padding:8px 10px;background:#16162a;border:1px solid #333;border-radius:6px;color:#e0e0e0;font-size:12px;font-family:inherit;line-height:1.4;resize:vertical;outline:none;transition:border-color 0.15s;"></textarea>
    <div class="hint">Extra context appended to the enhancement prompt</div>
  </div>

  <div id="mcpServers" style="display:none;margin-bottom:14px;">
    <label>Connected MCP Servers</label>
    <div id="mcpServerList" style="display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;"></div>
  </div>

  <div class="actions">
    <button class="btn-save" id="saveBtn">Save</button>
    <button class="btn-test" id="testBtn">Test Connection</button>
  </div>

  <div class="status" id="status"></div>

  <script src="options.js"></script>
</body>
</html>
